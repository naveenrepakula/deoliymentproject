name: Deploy Glue Script to S3

on:
  push:
    branches:
      - main
    paths:
      - "ingestion.py"
      - ".github/workflows/deploy-glue.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  SCRIPT_BUCKET: landing-zone-api-data
  SCRIPT_KEY: glue-scripts/ingestion.py

jobs:
  deploy:
    name: Upload Glue Script
    runs-on: ubuntu-latest

    steps:
      # Download the GitHub repository into the GitHub runner
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Load AWS access key and secret key from GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Confirm which AWS account the workflow is using
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Upload ingestion.py to the Glue scripts folder in S3
      - name: Upload Glue Script to S3
        run: |
          aws s3 cp ingestion.py \
            "s3://${SCRIPT_BUCKET}/${SCRIPT_KEY}"